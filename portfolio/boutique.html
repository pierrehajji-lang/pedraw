<script>
// Grand titre : sa taille s'ajuste pour remplir toute la largeur, comme dans la boîte à outils
const giant = document.getElementById('giant'), fit = () => {
  const r = document.createRange(); r.selectNodeContents(giant);
  giant.style.fontSize = '100px';
  giant.style.fontSize = 100 * giant.clientWidth / r.getBoundingClientRect().width + 'px';
};
fit(); addEventListener('resize', fit); document.fonts.ready.then(fit);
// Menu noir dès que le dégradé derrière lui devient clair (blanc à 85 % de la hauteur)
const nav = document.querySelector('.nav'), soon = document.querySelector('.soon');
const tint = () => {
  const b = soon.getBoundingClientRect(), n = nav.getBoundingClientRect();
  nav.classList.toggle('on-light', (n.top + n.height / 2 - b.top) / (b.height * 0.85) > 0.46);
};
tint(); addEventListener('scroll', tint, { passive: true }); addEventListener('resize', tint);
</script>
